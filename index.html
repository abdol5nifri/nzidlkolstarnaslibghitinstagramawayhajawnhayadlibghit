<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معدل الأسطر - Morad App</title>
    <style>
        /* التنسيقات العامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9fafb;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* الهيدر */
        header {
            background: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f3f4f6;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #111827;
            font-size: 14px;
            font-weight: bold;
        }

        .clear-btn {
            background: #fef2f2;
            color: #ef4444;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:active {
            transform: scale(0.95);
        }

        /* المحتوى الرئيسي */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            overflow: hidden;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group {
            flex: 5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .result-group {
            flex: 5;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        /* الحقول */
        .input-wrapper {
            position: relative;
        }

        input, textarea {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }

        input {
            padding-right: 32px; /* للأيقونة */
        }

        textarea {
            flex: 1;
            resize: none;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        input:focus, textarea:focus {
            border-color: #2563eb;
        }

        /* إخفاء الـ placeholder عند الضغط */
        input:focus::placeholder, textarea:focus::placeholder {
            color: transparent;
        }

        /* أيقونة الزائد داخل الحقل */
        .plus-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
        }

        /* إخفاء سكرول بار */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* الأزرار */
        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-blue { background: #2563eb; color: white; }
        .btn-gray { background: #e5e7eb; color: #374151; }
        .btn-black { background: #111827; color: white; }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #f3f4f6; color: #d1d5db; cursor: not-allowed; }

        /* النتيجة */
        .result-area {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #4b5563;
        }

        /* تنبيه النسخ */
        #copy-toast {
            position: absolute;
            top: 6px;
            left: 8px;
            background: white;
            border: 1px solid #dcfce7;
            color: #166534;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            display: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            z-index: 10;
        }

        /* الفوتر */
        footer {
            background: white;
            padding: 4px;
            text-align: center;
            font-size: 8px;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <!-- أيقونة ClipboardList -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            معدل الأسطر
        </div>
        <button class="clear-btn" onclick="clearAll()">
            <!-- أيقونة Trash2 -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            مسح
        </button>
    </header>

    <main>
        <!-- قسم الإدخال -->
        <div class="input-group">
            <div class="input-wrapper">
                <span class="plus-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </span>
                <input type="text" id="prefix" placeholder="البادئة (مثال: - )" spellcheck="false">
            </div>
            <textarea id="lines" class="no-scrollbar" placeholder="اكتب الأسطر هنا..." spellcheck="false"></textarea>
        </div>

        <!-- أزرار التحكم -->
        <div class="actions">
            <button class="btn btn-blue" onclick="addPrefix()">إضافة</button>
            <button class="btn btn-gray" onclick="removePrefix()">حذف</button>
            <button class="btn btn-black" id="copy-btn" onclick="copyResult()" disabled>
                <span id="copy-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </span>
                <span id="copy-text">نسخ</span>
            </button>
        </div>

        <!-- قسم النتيجة -->
        <div class="result-group">
            <div id="copy-toast">تم النسخ</div>
            <textarea id="result" class="result-area no-scrollbar" placeholder="النتيجة غتبان هنا..." readonly spellcheck="false"></textarea>
        </div>
    </main>

    <footer>
        أداة التعديل السريع • Morad App
    </footer>

    <script>
        const prefixInput = document.getElementById('prefix');
        const linesInput = document.getElementById('lines');
        const resultOutput = document.getElementById('result');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const copyIcon = document.getElementById('copy-icon');
        const copyToast = document.getElementById('copy-toast');

        // إضافة البادئة
        function addPrefix() {
            const prefix = prefixInput.value;
            const content = linesInput.value;
            if (!content) return;

            const res = content.split('\n').map(line => prefix + line).join('\n-----------------------\n');
            updateResult(res);
        }

        // إرجاع النص الأصلي (الحذف)
        function removePrefix() {
            const content = linesInput.value;
            if (!content) return;
            updateResult(content);
        }

        // تحديث حقل النتيجة
        function updateResult(val) {
            resultOutput.value = val;
            copyBtn.disabled = !val;
        }

        // نسخ النتيجة
        function copyResult() {
            const val = resultOutput.value;
            if (!val) return;

            navigator.clipboard.writeText(val).then(() => {
                // إظهار التنبيه
                copyToast.style.display = 'flex';
                copyText.innerText = 'تم';
                copyIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
                
                setTimeout(() => {
                    copyToast.style.display = 'none';
                    copyText.innerText = 'نسخ';
                    copyIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
                }, 2000);
            });
        }

        // مسح الكل
        function clearAll() {
            prefixInput.value = '';
            linesInput.value = '';
            resultOutput.value = '';
            copyBtn.disabled = true;
        }

        // اختصار لوحة المفاتيح Ctrl+Enter
        [prefixInput, linesInput].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    addPrefix();
                }
            });
        });
    </script>
</body>
</html>
